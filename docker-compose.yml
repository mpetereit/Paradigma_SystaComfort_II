services:
  systa-bridge:
    build: .
    container_name: systa-bridge
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
      # lokale Zeitzone (Tageswechsel fuer den Solar-Tagesgewinn)
      - /etc/localtime:/etc/localtime:ro
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
